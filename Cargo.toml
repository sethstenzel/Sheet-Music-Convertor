[package]
name = "sheet-music-convertor"
version = "0.1.0"
edition = "2021"
description = "Convert photos of hymnals and sheet music into MuseScore / MusicXML and piano MIDI using Claude"
license = "MIT"
default-run = "sheet-music-convertor"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.31" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
directories = "6"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
roxmltree = "0.20"
